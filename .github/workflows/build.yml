name: Build seaf-daemon / libseafile / libsearpc

on:
  push:
    branches:
      - feat/win-arm64
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      libsearpc_ref:
        description: "Git ref of haiwen/libsearpc to build against"
        required: false
        default: "master"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  LIBSEARPC_REPO: "https://github.com/haiwen/libsearpc.git"
  LIBSEARPC_REF: ${{ github.event.inputs.libsearpc_ref || 'master' }}
  PKG_NAME_PREFIX: "seafile-daemon"

jobs:
  # ------------------------------------------------------------------
  # Linux (x64 / arm64)
  # ------------------------------------------------------------------
  linux:
    name: linux-${{ matrix.arch }}
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout seafile
        uses: actions/checkout@v4
        with:
          path: seafile

      - name: Checkout libsearpc
        uses: actions/checkout@v4
        with:
          repository: haiwen/libsearpc
          ref: ${{ env.LIBSEARPC_REF }}
          path: libsearpc

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config \
            intltool valac \
            libglib2.0-dev libglib2.0-bin libjansson-dev libevent-dev \
            libsqlite3-dev uuid-dev zlib1g-dev \
            libssl-dev libcurl4-openssl-dev \
            python3 python3-pip ca-certificates git

      - name: Build & install libsearpc
        working-directory: libsearpc
        env:
          PREFIX: ${{ github.workspace }}/install
          PYTHON: python3
        run: |
          ./autogen.sh
          ./configure --prefix="$PREFIX" --disable-compile-demo PYTHON=python3
          make -j"$(nproc)"
          make install

      - name: Build seafile daemon
        working-directory: seafile
        env:
          PREFIX: ${{ github.workspace }}/install
          PYTHON: python3
        run: |
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$PREFIX/lib64/pkgconfig:${PKG_CONFIG_PATH-}"
          export LD_LIBRARY_PATH="$PREFIX/lib:$PREFIX/lib64:${LD_LIBRARY_PATH-}"
          ./autogen.sh
          ./configure --prefix="$PREFIX" --with-python3 --disable-fuse PYTHON=python3
          make -j"$(nproc)"
          make install

      - name: Stage artifacts
        env:
          PREFIX: ${{ github.workspace }}/install
          STAGING: ${{ github.workspace }}/staging
        run: |
          set -euxo pipefail
          mkdir -p "$STAGING/bin" "$STAGING/lib"
          cp -v "$PREFIX/bin/seaf-daemon" "$STAGING/bin/"
          # Copy shared libs (libseafile / libsearpc) preserving symlinks.
          for libdir in "$PREFIX/lib" "$PREFIX/lib64"; do
            [ -d "$libdir" ] || continue
            find "$libdir" -maxdepth 1 \
                \( -name 'libseafile*.so*' -o -name 'libsearpc*.so*' \) \
                -print -exec cp -av {} "$STAGING/lib/" \;
          done
          ls -lR "$STAGING"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME_PREFIX }}-linux-${{ matrix.arch }}
          path: staging
          if-no-files-found: error

  # ------------------------------------------------------------------
  # macOS (x64 / arm64)
  # ------------------------------------------------------------------
  macos:
    name: macos-${{ matrix.arch }}
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 was retired by GitHub on 2025-12-04. The last
          # GitHub-hosted free x86_64 image is `macos-15-intel`, which is
          # advertised to be available through Fall 2027.
          - arch: x64
            runner: macos-15-intel
            brew_prefix: /usr/local
          - arch: arm64
            runner: macos-14
            brew_prefix: /opt/homebrew
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout seafile
        uses: actions/checkout@v4
        with:
          path: seafile

      - name: Checkout libsearpc
        uses: actions/checkout@v4
        with:
          repository: haiwen/libsearpc
          ref: ${{ env.LIBSEARPC_REF }}
          path: libsearpc

      - name: Install build dependencies (Homebrew)
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: |
          # `--overwrite` lets brew replace files (e.g. pre-installed python3
          # symlinks shipped on the macos-15-intel image) that would otherwise
          # break the `brew link` step.
          brew install --overwrite \
            autoconf automake libtool pkg-config \
            intltool gettext vala \
            glib jansson libevent \
            sqlite openssl@3 libwebsockets \
            curl
          # gettext / openssl are keg-only; expose them.
          echo "${{ matrix.brew_prefix }}/opt/gettext/bin" >> $GITHUB_PATH

      - name: Configure environment
        run: |
          BREW_PREFIX="${{ matrix.brew_prefix }}"
          {
            echo "PKG_CONFIG_PATH=$BREW_PREFIX/lib/pkgconfig:$BREW_PREFIX/opt/openssl@3/lib/pkgconfig:$BREW_PREFIX/opt/curl/lib/pkgconfig:$BREW_PREFIX/opt/sqlite/lib/pkgconfig"
            echo "ACLOCAL_PATH=$BREW_PREFIX/share/aclocal"
            echo "LDFLAGS=-L$BREW_PREFIX/lib -L$BREW_PREFIX/opt/openssl@3/lib"
            echo "CPPFLAGS=-I$BREW_PREFIX/include -I$BREW_PREFIX/opt/openssl@3/include"
          } >> "$GITHUB_ENV"

      - name: Build & install libsearpc
        working-directory: libsearpc
        env:
          PREFIX: ${{ github.workspace }}/install
          PYTHON: python3
        run: |
          # libsearpc's autogen.sh hard-codes the MacPorts aclocal path
          # (/opt/local/share/aclocal) which doesn't exist on brew-only
          # runners. Use autoreconf directly to honour ACLOCAL_PATH instead.
          autoreconf -fi -I m4
          ./configure --prefix="$PREFIX" --disable-compile-demo PYTHON=python3
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Build seafile daemon
        working-directory: seafile
        env:
          PREFIX: ${{ github.workspace }}/install
          PYTHON: python3
        run: |
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH"
          export DYLD_LIBRARY_PATH="$PREFIX/lib:${DYLD_LIBRARY_PATH-}"
          # Same rationale as libsearpc: skip autogen.sh's hard-coded paths.
          autoreconf -fi -I m4
          ./configure --prefix="$PREFIX" --with-python3 --disable-fuse PYTHON=python3
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Stage artifacts
        env:
          PREFIX: ${{ github.workspace }}/install
          STAGING: ${{ github.workspace }}/staging
        run: |
          set -euxo pipefail
          mkdir -p "$STAGING/bin" "$STAGING/lib"
          cp -v "$PREFIX/bin/seaf-daemon" "$STAGING/bin/"
          find "$PREFIX/lib" -maxdepth 1 \
              \( -name 'libseafile*.dylib' -o -name 'libsearpc*.dylib' \) \
              -print -exec cp -av {} "$STAGING/lib/" \;
          ls -lR "$STAGING"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME_PREFIX }}-macos-${{ matrix.arch }}
          path: staging
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Windows x64 (MSYS2 + MinGW64)
  # ------------------------------------------------------------------
  windows:
    name: windows-x64
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout seafile
        uses: actions/checkout@v4
        with:
          path: seafile

      - name: Checkout libsearpc
        uses: actions/checkout@v4
        with:
          repository: haiwen/libsearpc
          ref: ${{ env.LIBSEARPC_REF }}
          path: libsearpc

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            autoconf
            automake
            libtool
            intltool
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-vala
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-jansson
            mingw-w64-x86_64-libevent
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-libwebsockets
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-python

      - name: Provide libpthread.a alias for winpthreads
        run: |
          set -euxo pipefail
          # MSYS2's modern winpthreads package only ships libwinpthread.a;
          # the historical libpthread.a alias was dropped, which makes
          # `gcc -lpthread` (and configure's AC_CHECK_LIB([pthread])) fail.
          # Create a tiny GNU ld linker script that redirects -lpthread to
          # -lwinpthread so existing autoconf checks keep working.
          if [ ! -f /mingw64/lib/libpthread.a ] && [ -f /mingw64/lib/libwinpthread.a ]; then
            printf 'INPUT(-lwinpthread)\n' > /mingw64/lib/libpthread.a
          fi
          ls -l /mingw64/lib/libpthread.a /mingw64/lib/libwinpthread.a || true

      - name: Build & install libsearpc
        working-directory: libsearpc
        env:
          PREFIX: ${{ github.workspace }}/install
          PYTHON: python3
        run: |
          set -euxo pipefail
          # GitHub Actions sets $GITHUB_WORKSPACE in Windows-style; convert.
          PREFIX_UNIX="$(cygpath -u "$PREFIX")"
          ./autogen.sh
          ./configure --prefix="$PREFIX_UNIX" --disable-compile-demo PYTHON=python3
          make -j"$(nproc)"
          make install

      - name: Build seafile daemon
        working-directory: seafile
        env:
          PREFIX: ${{ github.workspace }}/install
          PYTHON: python3
        run: |
          set -euxo pipefail
          PREFIX_UNIX="$(cygpath -u "$PREFIX")"
          export PKG_CONFIG_PATH="$PREFIX_UNIX/lib/pkgconfig:${PKG_CONFIG_PATH-}"
          export PATH="$PREFIX_UNIX/bin:$PATH"
          ./autogen.sh
          # AC_CHECK_LIB's stub conftest is unreliable on MinGW (it
          # mis-detects symbols whose import libraries are clearly available
          # and used by libsearpc on the same toolchain). Skip those probes
          # by priming the autoconf cache; the actual link is performed by
          # make and will surface real linker errors if anything is missing.
          # uuid_generate is additionally bypassed because lib/utils.c uses
          # Windows' UuidCreate (Rpcrt4) on WIN32.
          ./configure --prefix="$PREFIX_UNIX" --with-python3 --disable-fuse \
            PYTHON=python3 \
            ac_cv_lib_c_uuid_generate=yes \
            ac_cv_lib_pthread_pthread_create=yes \
            ac_cv_lib_sqlite3_sqlite3_open=yes \
            ac_cv_lib_crypto_SHA1_Init=yes
          make -j"$(nproc)"
          make install

      - name: Dump config.log on failure
        if: failure()
        working-directory: seafile
        run: |
          if [ -f config.log ]; then
            echo "::group::seafile/config.log (tail 400)"
            tail -n 400 config.log
            echo "::endgroup::"
          fi

      - name: Stage artifacts
        env:
          PREFIX: ${{ github.workspace }}/install
          STAGING: ${{ github.workspace }}/staging
        run: |
          set -euxo pipefail
          PREFIX_UNIX="$(cygpath -u "$PREFIX")"
          STAGING_UNIX="$(cygpath -u "$STAGING")"
          mkdir -p "$STAGING_UNIX/bin" "$STAGING_UNIX/lib"
          cp -v "$PREFIX_UNIX/bin/seaf-daemon.exe" "$STAGING_UNIX/bin/"
          # On MinGW, libtool puts shared libs (DLLs) in bin/ and import libs in lib/.
          find "$PREFIX_UNIX/bin" -maxdepth 1 \
              \( -name 'libseafile*.dll' -o -name 'libsearpc*.dll' \) \
              -print -exec cp -av {} "$STAGING_UNIX/bin/" \;
          find "$PREFIX_UNIX/lib" -maxdepth 1 \
              \( -name 'libseafile*.dll.a' -o -name 'libsearpc*.dll.a' \) \
              -print -exec cp -av {} "$STAGING_UNIX/lib/" \; || true
          # Bundle the MinGW runtime DLLs that seaf-daemon links against, so the
          # binary can be run on a clean Windows host without MSYS2 installed.
          ldd "$STAGING_UNIX/bin/seaf-daemon.exe" \
            | awk '{print $3}' \
            | grep -Ei '^/(mingw64|ucrt64)/' \
            | sort -u \
            | while read -r dep; do
                [ -f "$dep" ] && cp -v "$dep" "$STAGING_UNIX/bin/"
              done || true
          ls -lR "$STAGING_UNIX"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME_PREFIX }}-windows-x64
          path: staging
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Windows ARM64 (MSVC + vcpkg)
  # ------------------------------------------------------------------
  windows-arm64:
    name: windows-arm64
    runs-on: windows-11-arm
    permissions:
      contents: read
      actions: write
      packages: write
    env:
      VCPKG_COMMIT: '2026.06.01'
      VCPKG_TRIPLET: arm64-windows
      VCPKG_NUGET_FEED: 'https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json'
      SEAF_DAEMON_EXE: 'build-seaf-daemon-arm64/bin/seaf-daemon.exe'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout seafile
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Restore vcpkg downloads cache
        id: vcpkg-downloads
        uses: actions/cache/restore@v4
        with:
          path: C:\vcpkg\downloads
          key: vcpkg-downloads-${{ env.VCPKG_TRIPLET }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('.github/vcpkg-deps.txt', '.github/vcpkg-ports/**') }}
          restore-keys: |
            vcpkg-downloads-${{ env.VCPKG_TRIPLET }}-

      - name: Bootstrap vcpkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          if (-not (Test-Path "C:\vcpkg\.git")) {
            git init C:\vcpkg | Out-Null
            git -C C:\vcpkg remote add origin https://github.com/microsoft/vcpkg.git
          }
          git -C C:\vcpkg fetch --depth 1 origin "refs/tags/$env:VCPKG_COMMIT" 2>$null
          if ($LASTEXITCODE -ne 0) {
            git -C C:\vcpkg fetch --depth 1 origin $env:VCPKG_COMMIT
          }
          git -C C:\vcpkg checkout --force FETCH_HEAD
          "VCPKG_ROOT=C:\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & C:\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $nuget = (& C:\vcpkg\vcpkg.exe fetch nuget | Select-Object -Last 1).Trim()
          & $nuget sources Remove -Name GitHubPackages -NonInteractive 2>$null | Out-Null
          & $nuget sources add -Source $env:VCPKG_NUGET_FEED -Name GitHubPackages `
            -Username $env:GITHUB_REPOSITORY_OWNER -Password $env:GITHUB_TOKEN `
            -StorePasswordInClearText -NonInteractive
          & $nuget setapikey $env:GITHUB_TOKEN -Source $env:VCPKG_NUGET_FEED -NonInteractive
          "VCPKG_BINARY_SOURCES=clear;nuget,GitHubPackages,readwrite" `
            | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install vcpkg runtime deps
        run: |
          $ErrorActionPreference = 'Stop'
          $deps = Get-Content .github/vcpkg-deps.txt `
            | Where-Object { $_ -and -not $_.TrimStart().StartsWith('#') } `
            | ForEach-Object { "$($_.Trim()):$env:VCPKG_TRIPLET" }
          $deps += "libsearpc:$env:VCPKG_TRIPLET"
          Write-Host "Installing vcpkg ports: $($deps -join ', ')"
          & C:\vcpkg\vcpkg.exe install `
            --overlay-ports=.github/vcpkg-ports `
            --overlay-triplets=.github/vcpkg-triplets `
            @deps 2>&1 `
            | Tee-Object -Variable out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($out -match 'credential providers requested manual action') {
            Write-Host "::warning::vcpkg NuGet cache auth failed; ports were built from source."
          }

      - name: Save vcpkg downloads cache
        if: steps.vcpkg-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\vcpkg\downloads
          key: vcpkg-downloads-${{ env.VCPKG_TRIPLET }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('.github/vcpkg-deps.txt', '.github/vcpkg-ports/**') }}

      - name: Build ARM64 seaf-daemon.exe
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S .github/cmake/windows-arm64-seaf-daemon -B build-seaf-daemon-arm64 `
            -A ARM64 `
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=$env:VCPKG_TRIPLET `
            -DSEAFILE_ROOT="${{ github.workspace }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-seaf-daemon-arm64 --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path $env:SEAF_DAEMON_EXE)) {
            throw "missing $env:SEAF_DAEMON_EXE"
          }
          Write-Host "Built $env:SEAF_DAEMON_EXE"

      - name: Stage artifacts
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-PEMachine([string]$p) {
            $fs = [IO.File]::OpenRead($p); $br = New-Object IO.BinaryReader($fs)
            $fs.Seek(0x3C, 'Begin') | Out-Null; $peoff = $br.ReadInt32()
            $fs.Seek($peoff, 'Begin') | Out-Null; $null = $br.ReadUInt32()
            $m = $br.ReadUInt16(); $fs.Close(); return $m
          }
          $want = 0xAA64
          $staging = Join-Path $env:GITHUB_WORKSPACE 'staging'
          $bin = Join-Path $staging 'bin'
          $lib = Join-Path $staging 'lib'
          New-Item -ItemType Directory -Force -Path $bin, $lib | Out-Null

          Copy-Item $env:SEAF_DAEMON_EXE (Join-Path $bin 'seaf-daemon.exe') -Force
          $got = Get-PEMachine (Join-Path $bin 'seaf-daemon.exe')
          Write-Host ("seaf-daemon.exe PE machine 0x{0:X}" -f $got)
          if ($got -ne $want) {
            throw "seaf-daemon.exe is not ARM64 (got 0x$($got.ToString('X')))"
          }

          $prefix = "C:\vcpkg\installed\$env:VCPKG_TRIPLET"
          Copy-Item "$prefix\bin\*.dll" $bin -Force
          $searpcDll = Join-Path $prefix 'bin\libsearpc.dll'
          if (-not (Test-Path $searpcDll)) { throw "vcpkg did not install $searpcDll" }
          Copy-Item $searpcDll (Join-Path $bin 'libsearpc.dll') -Force
          $dllMach = Get-PEMachine (Join-Path $bin 'libsearpc.dll')
          Write-Host ("libsearpc.dll PE machine 0x{0:X}" -f $dllMach)
          if ($dllMach -ne $want) {
            throw "libsearpc.dll is not ARM64 (got 0x$($dllMach.ToString('X')))"
          }

          Copy-Item "$prefix\lib\libsearpc.lib" $lib -Force

          $required = @(
            'ffi-8.dll', 'glib-2.0-0.dll', 'gobject-2.0-0.dll',
            'iconv-2.dll', 'intl-8.dll', 'jansson.dll',
            'libcrypto-3-arm64.dll', 'libcurl.dll', 'libsearpc.dll',
            'libssl-3-arm64.dll', 'pcre2-8.dll', 'pthreadVC3.dll',
            'sqlite3.dll', 'z.dll', 'getopt.dll', 'websockets.dll', 'uv.dll'
          )
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $bin $_)) }
          if ($missing) {
            Write-Host 'staged bin:'; Get-ChildItem $bin | Select-Object -ExpandProperty Name
            throw "Missing ARM64 runtime DLLs: $($missing -join ', ')"
          }
          if (-not ((Test-Path (Join-Path $bin 'event.dll')) -or (Test-Path (Join-Path $bin 'event_core.dll')))) {
            throw 'Missing libevent DLL (event.dll or event_core.dll)'
          }
          Get-ChildItem $staging -Recurse | Format-Table FullName, Length -AutoSize

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME_PREFIX }}-windows-arm64
          path: staging
          if-no-files-found: error
